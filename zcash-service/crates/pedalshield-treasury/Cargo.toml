[package]
name = "pedalshield-treasury"
version = "0.1.0"
edition = "2021"
description = "Pedalshield FROST treasury and shielded payout service"
license = "MIT"
publish = false
build = "build.rs"

[build-dependencies]
tonic-build = "0.11"

[dependencies]
# FROST over RedPallas with rerandomization (ZIP-312) - the ciphersuite
# Zcash uses for Orchard spend auth. Pinned to versions that resolve to
# a single frost-core (3.0); mixing 2.x and 3.x breaks type unification.
reddsa = { version = "0.5", features = ["frost"] }
frost-rerandomized = "3"

# Orchard transaction construction. As of v0.5 these are *default* deps
# (no longer behind a feature flag) because the mainnet payout path is
# now in the critical path for the hackathon submission.
#
# Version pins are wildcards: zcash crate versions move together with
# librustzcash releases. Cargo picks the latest compatible release.
# Pin to exact versions once v0.5 stabilises on mainnet.
# All zcash crates pinned to published versions that we KNOW work
# (verified by treasury_keygen + treasury_balance compiling + running
# end-to-end on mainnet at v0.5.2). These are the same versions that
# scan blocks and IVK-decrypt notes successfully today.
# Nu6.2 generation. The June 2026 emergency upgrade (consensus branch id
# 0x5437f330 = BranchId::Nu6_2, mainnet block 3,364,600) is only known to
# zcash_protocol >= 0.9, so the whole stack must move together.
orchard          = "0.14"
zcash_primitives = "0.28"
zcash_address    = "0.12"
zcash_keys       = { version = "0.14", features = ["orchard"] }
zcash_protocol   = "0.9"
zip32            = "0.2"

# Seed phrase generation for the treasury backup. Standard BIP-39
# wordlist + entropy. `tiny-bip39` is the maintained fork.
tiny-bip39 = "1"

rand   = "0.8"
sha2   = "0.10"
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex    = "0.4"

# Backend HTTP service (axum + tokio + rusqlite). Used by the `backend`
# binary; not pulled in by the library's other consumers because cargo
# bin-targets only compile their direct deps + the lib's deps.
axum                = "0.7"
tokio               = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower               = "0.4"
tower-http          = { version = "0.5", features = ["trace", "cors"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
rusqlite            = { version = "0.37", features = ["bundled"] }
uuid                = { version = "1", features = ["v4"] }

# Lightwalletd gRPC client (used by `treasury_ping` and later by the
# wallet scanner / broadcaster). Vendored .proto in `proto/`; build.rs
# runs tonic-build to generate the Rust bindings into the OUT_DIR.
tonic               = { version = "0.11", features = ["tls", "tls-roots"] }
prost               = "0.12"
tokio-stream        = "0.1"

# Note encryption / decryption primitives. Pulled in transitively
# through `orchard`, but we use the trait method `try_compact_note_decryption`
# directly so it's listed explicitly for clarity.
zcash_note_encryption = "*"

# zcash_client_backend / zcash_client_sqlite are NOT used. The
# published crates.io pair has inconsistent APIs and the librustzcash
# main branch is mid-refactor with internal compile errors. Instead we
# hand-roll Orchard spend construction on `orchard` + `bridgetree`.

# Incremental Merkle tree that lets us append commitments as we sync,
# mark our notes' positions, and compute witnesses on demand. orchard
# 0.13 pulls incrementalmerkletree 0.8 directly (BridgeTree was folded
# into the crate in 0.8; the separate `bridgetree` crate is no longer
# needed). Pin to match orchard exactly so trait impls unify.
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }

# Needed for zcash_primitives' v5 TransactionBuilder generics. We build a
# fully-shielded Orchard tx (no transparent, no sapling), so:
#  - `transparent` supplies the empty TransparentSigningSet.
#  - `sapling`'s mock provers satisfy the SpendProver/OutputProver bounds;
#    they are never called because the tx has zero Sapling components, so
#    no Sapling proving parameters (the 50MB params files) are required.
# Versions match what zcash_primitives 0.27 already resolves to.
# Pin EXACTLY to the versions zcash_primitives 0.27 links, or the
# TransparentSigningSet / prover types won't unify across crate versions.
transparent = { package = "zcash_transparent", version = "=0.8.0" }
sapling = { package = "sapling-crypto", version = "=0.7.0", features = ["test-dependencies"] }

# CLI subcommand parsing for the treasury_wallet binary.
clap = { version = "4", features = ["derive"] }

[features]
default = []
# Legacy flag kept for backward compatibility with v0.3-v0.4 callers.
# Now a no-op because orchard + zcash_primitives are default deps.
orchard-integration = []

[[bin]]
name = "treasury_demo"
path = "src/bin/treasury_demo.rs"

[[bin]]
name = "treasury_keygen"
path = "src/bin/treasury_keygen.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[[bin]]
name = "treasury_ping"
path = "src/bin/treasury_ping.rs"

[[bin]]
name = "treasury_balance"
path = "src/bin/treasury_balance.rs"

[[bin]]
name = "treasury_wallet"
path = "src/bin/treasury_wallet.rs"
