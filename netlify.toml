# Netlify deploy config for the Pedalshield waitlist landing page.
# One-click: push this repo, then on netlify.com "Add new site" → "Import from Git"
# → pick this repo → Deploy. Netlify reads this file automatically; no settings to fill in.

[build]
  # No build step — it's a static site. Publish the landing/ folder as the site root.
  publish = "landing"
  command = ""

# Make the bare domain land on the waitlist page too (pedalshield.app → /beta/).
[[redirects]]
  from = "/"
  to = "/beta/"
  status = 302

# Tidy security headers (optional but nice).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
