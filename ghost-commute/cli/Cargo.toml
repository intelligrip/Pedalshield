[package]
name = "ghost-commute"
version = "0.1.0"
edition = "2021"
description = "Ghost Commute: attest a bike ride locally, get paid in shielded ZEC, disclose one note without the route."
license = "MIT"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
rand = { version = "0.8", features = ["std", "std_rng"] }
tokio = { version = "1.21.0", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Zcash: same versions zcash-devtool pins, so the two tools agree on everything.
orchard = { version = "0.15.0", features = ["circuit"] }
zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30.0"
zcash_protocol = "0.10.3"
zip32 = "0.2"
incrementalmerkletree = "0.8"
group = "0.13"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
